[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "philologic"
version = "5.5.0a0"
authors = [
    { name = "Clovis Gladstone", email = "clovisgladstone@artfl.uchicago.edu" },
]
license = "GPL-3.0-or-later"
description = "A concordance search engine for TEI-XML"
readme = "README"
urls = { Homepage = "https://github.com/ARTFL-Project/PhiloLogic5" }

requires-python = ">=3.11"
dependencies = [
    "regex",
    "lxml",
    "python-levenshtein",
    "natsort",
    "dill",
    "tqdm",
    "orjson",
    "black",
    "msgspec",
    "unidecode",
    "PyICU~=2.16",
    "lz4",
    "lmdb",
    "numpy~=2.3",
    "numba~=0.63",
    "scikit-learn~=1.8",
    "hdbscan~=0.8",
    "pandas~=2.3",
    "spacy~=3.8",
    "netaddr",
]

[project.optional-dependencies]
transformers = [
    "spacy-transformers~=1.4.0",
    "cupy-cuda12x; sys_platform == 'linux'",  # spaCy runs models on NVIDIA GPUs with it
]
# FlashAttention, which models like ModernBERT use once installed (NVIDIA GPU, Ampere or newer). Its build imports torch:
# install it after the transformers extra, with --no-build-isolation-package flash-attn
flash-attn = [
    "flash-attn~=2.8",
    "transformers>=4.53",  # the ModernBERT of older versions fails to load with flash-attn 2.8
    "torch>=2.5,<2.9",  # those flash-attn 2.8 has prebuilt wheels for (CUDA 12): for others, it compiles for hours
]
# philologic5-webui-loader, and the web app (install.sh installs them)
web = ["gunicorn>=26.1,<27", "falcon>=4.3,<5"]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-benchmark>=4.0",
]

[tool.setuptools]
packages = [
    "philologic",
    "philologic.runtime",
    "philologic.utils",
    "philologic.runtime.reports",
    "philologic.loadtime",
    "philologic.webui_loader",
    "philologic.webui_loader.server",
]
