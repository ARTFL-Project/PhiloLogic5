# Settings of philologic5-webui-loader, in PhiloLogic's global config (/etc/philologic/philologic5.cfg): copy the ones
# you need there. They are read, not run: literal values only. See docs/webui_loader.md.

# philologic5-webui-loader, the web UI to load databases: False turns it off
webui_loader = True

# Directories whose files can be loaded as a service (users see nothing else of the machine). On your own machine,
# where the file browser starts.
webui_loader_allowed_roots = ["/data/corpora"]

# Most cores a load can use (None: all of them).
webui_loader_max_cores = None

# The service (philologic5-webui-loader serve, set up by install.sh). The web server of the databases serves it on their
# host, over HTTPS, at https://<host of url_root>/philologic5-webui-loader/ (see apache.conf, nginx.conf): the address
# it passes requests on to, and its own addresses, the only ones trusted for X-Forwarded-Proto and X-Forwarded-For.
webui_loader_bind = "127.0.0.1:8766"
webui_loader_forwarded_allow_ips = ["127.0.0.1"]

# Users' uploads, in a directory per user (leave out to disable uploads), and how much each user can upload (bytes).
webui_loader_upload_dir = "/var/lib/philologic5-webui-loader/uploads"
webui_loader_upload_quota = 21474836480

# Accounts, sessions, audit log and loads. Not under /var/lib/philologic5, which install.sh deletes.
webui_loader_state_dir = "/var/lib/philologic5-webui-loader"

# Logins: sessions end after this idle time and this age (seconds); failed logins lock an account (or an address)
# for lockout_time after max_failed_logins (max_failed_logins_per_ip).
webui_loader_session_idle_timeout = 28800
webui_loader_session_max_age = 86400
webui_loader_max_failed_logins = 5
webui_loader_max_failed_logins_per_ip = 20
webui_loader_lockout_time = 900
# How long a browser can be trusted for the second factor, so that the password is enough in it (0: never)
webui_loader_trusted_browser_days = 30

# webui_loader_threads = 8  # requests served at once
