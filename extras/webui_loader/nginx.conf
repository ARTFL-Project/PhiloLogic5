# Nginx serving the philologic5-webui-loader service on the host of the databases, at /philologic5-webui-loader/:
# add to the server block (listen 443 ssl) which serves url_root, then reload Nginx. 127.0.0.1:8766 is
# webui_loader_bind.
location /philologic5-webui-loader {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upload chunks are up to 8 MB
    client_max_body_size 10m;
    proxy_read_timeout 300s;
}
