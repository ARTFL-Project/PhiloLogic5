# Apache serving the philologic5-webui-loader service on the host of the databases, at /philologic5-webui-loader/:
# add to the <VirtualHost *:443> which serves url_root, with mod_proxy, mod_proxy_http and mod_headers
# (sudo a2enmod proxy proxy_http headers), then reload Apache. 127.0.0.1:8766 is webui_loader_bind.
<Location "/philologic5-webui-loader">
    ProxyPass "http://127.0.0.1:8766/philologic5-webui-loader" timeout=300
    ProxyPassReverse "http://127.0.0.1:8766/philologic5-webui-loader"
    RequestHeader set X-Forwarded-Proto "https"
</Location>
